openapi: 3.0.3
info:
  title: DevBoard API
  description: Production-grade REST API documentation for the DevBoard full-stack job board platform.
  version: 1.0.0
  contact:
    name: DevBoard Support
    email: support@devboard.io
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
tags:
  - name: Health
    description: System liveness and health diagnostics
  - name: Auth
    description: Authentication, token refresh, and identity
  - name: Jobs
    description: Job listings, search, filtering, and CRUD
  - name: Applications
    description: Job applications, lifecycle state transitions, and tracking
  - name: Analytics
    description: Aggregation pipelines and employer metrics
  - name: Saved
    description: Job bookmarking and saved listings
  - name: SavedSearches
    description: Saved search queries with automated email alert preferences
  - name: Notifications
    description: Real-time and in-app candidate / employer notifications
  - name: Uploads
    description: Multipart resume uploads with automated skill and text extraction
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API and database connectivity status
      operationId: getHealthStatus
      responses:
        '200':
          description: System is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: healthy
                  uptime:
                    type: number
                    example: 45.2
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
                    example: development
                  database:
                    type: string
                    example: connected
                  requestId:
                    type: string
                    example: 7f3b8a1c-9941-4b2a-a7b2-c12d45e67f89
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new Job Seeker or Employer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Alex Developer
                email:
                  type: string
                  example: alex@example.com
                password:
                  type: string
                  example: P@ssw0rd123!
                role:
                  type: string
                  enum: [seeker, employer]
                  default: seeker
                companyName:
                  type: string
                  example: Acme Corp (required if employer)
                skills:
                  type: array
                  items:
                    type: string
                  example: [react, node.js, mongodb]
                experienceYears:
                  type: number
                  example: 4
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already registered
  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user and obtain access token + refresh token cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: alex@example.com
                password:
                  type: string
                  example: P@ssw0rd123!
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid email or password
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token and obtain new access token
      responses:
        '200':
          description: Session refreshed successfully
        '401':
          description: Invalid or expired refresh token
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
        '401':
          description: Unauthorized
  /jobs:
    get:
      tags:
        - Jobs
      summary: Search, filter, and paginate active job listings
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          description: Text search in title, company, skills, description
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: jobType
          schema:
            type: string
            enum: [full-time, part-time, contract, internship, temporary]
        - in: query
          name: experienceLevel
          schema:
            type: string
            enum: [entry, mid, senior, lead, executive]
        - in: query
          name: remote
          schema:
            type: boolean
        - in: query
          name: salaryMin
          schema:
            type: integer
        - in: query
          name: salaryMax
          schema:
            type: integer
        - in: query
          name: skills
          schema:
            type: string
            example: react,node.js
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [recent, salary, relevance, views]
            default: recent
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated job listings
    post:
      tags:
        - Jobs
      summary: Create a new job listing (Employer / Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, company, location, jobType, experienceLevel, skills]
              properties:
                title:
                  type: string
                  example: Senior Full-Stack Engineer
                description:
                  type: string
                  example: We are seeking a talented full-stack engineer to build scalable web applications.
                company:
                  type: string
                  example: Acme Corp
                location:
                  type: string
                  example: San Francisco, CA
                jobType:
                  type: string
                  enum: [full-time, part-time, contract, internship, temporary]
                  example: full-time
                experienceLevel:
                  type: string
                  enum: [entry, mid, senior, lead, executive]
                  example: senior
                salaryMin:
                  type: number
                  example: 130000
                salaryMax:
                  type: number
                  example: 175000
                skills:
                  type: array
                  items:
                    type: string
                  example: [react, node.js, mongodb, docker]
                remote:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Job created successfully
        '403':
          description: Forbidden (Job Seekers cannot post jobs)
  /jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job details by ID with applicant/saved context
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
        '404':
          description: Job not found
    put:
      tags:
        - Jobs
      summary: Update job listing (Owner-restricted or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job updated
        '403':
          description: Forbidden - not owner or admin
        '404':
          description: Job not found
    delete:
      tags:
        - Jobs
      summary: Delete job listing (Owner-restricted or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted
        '403':
          description: Forbidden - not owner or admin
  /jobs/my/listings:
    get:
      tags:
        - Jobs
      summary: List jobs posted by logged-in employer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employer's job listings
  /jobs/recommended:
    get:
      tags:
        - Jobs
      summary: Get AI smart-matched recommended jobs tailored to candidate profile
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of ranked recommended jobs with matchScore breakdown
        '403':
          description: Forbidden (Seeker only)
  /jobs/{id}/view:
    post:
      tags:
        - Jobs
      summary: Increment job views
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Views incremented
  /applications:
    post:
      tags:
        - Applications
      summary: Submit a job application (Seeker only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, resumeUrl]
              properties:
                jobId:
                  type: string
                  example: 65f123456789abcdef012345
                resumeUrl:
                  type: string
                  example: https://res.cloudinary.com/demo/image/upload/sample_resume.pdf
                resumeOriginalName:
                  type: string
                  example: alex_developer_resume.pdf
                coverNote:
                  type: string
                  example: Excited about this role and eager to contribute to the platform.
      responses:
        '201':
          description: Application submitted successfully
        '400':
          description: Cannot apply to inactive job or own job
        '409':
          description: Duplicate application
  /applications/my:
    get:
      tags:
        - Applications
      summary: List all applications submitted by the logged-in seeker
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated applications list
  /applications/job/{jobId}:
    get:
      tags:
        - Applications
      summary: List all applicants for a specific job (Owner employer or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [applied, under_review, shortlisted, interview, offered, rejected, hired, withdrawn]
      responses:
        '200':
          description: Applicants list
        '403':
          description: Forbidden - not job owner
  /applications/{id}:
    get:
      tags:
        - Applications
      summary: Get single application detail with status history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application details with status history timeline
        '403':
          description: Forbidden
        '404':
          description: Application not found
  /applications/{id}/status:
    patch:
      tags:
        - Applications
      summary: Update applicant status in pipeline (Owner employer or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [applied, under_review, shortlisted, interview, offered, rejected, hired]
                note:
                  type: string
                  example: Passed technical interview with high score
      responses:
        '200':
          description: Status updated and history recorded
        '403':
          description: Forbidden - not job owner
  /applications/{id}/withdraw:
    patch:
      tags:
        - Applications
      summary: Withdraw submitted application (Applicant only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Accepted another offer
      responses:
        '200':
          description: Application withdrawn
  /saved:
    get:
      tags:
        - Saved
      summary: List all bookmarked jobs for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of saved jobs
    post:
      tags:
        - Saved
      summary: Bookmark a job listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId:
                  type: string
                  example: 65f123456789abcdef012345
      responses:
        '201':
          description: Job bookmarked successfully
  /saved/{jobId}:
    delete:
      tags:
        - Saved
      summary: Remove a bookmarked job
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bookmark removed
  /uploads/resume:
    post:
      tags:
        - Uploads
      summary: Upload candidate resume with automatic skill and text extraction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
                  description: PDF or DOCX file (max 5MB)
      responses:
        '200':
          description: Upload successful with extracted resume data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: /uploads/resumes/resume-1710000000.pdf
                      originalName:
                        type: string
                        example: my_resume.pdf
                      parsed:
                        type: object
                        properties:
                          skills:
                            type: array
                            items:
                              type: string
                            example: [react, node.js, typescript, docker]
                          experienceYears:
                            type: number
                            example: 4
  /notifications:
    get:
      tags:
        - Notifications
      summary: Get paginated notifications and unread badge count
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: unreadOnly
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notification feed with unread count
  /notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all notifications as read for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked read
  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark a single notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read
  /notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete a notification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted
  /saved-searches:
    get:
      tags:
        - SavedSearches
      summary: List all saved job search alerts for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of saved searches
    post:
      tags:
        - SavedSearches
      summary: Save a search filter query with email alerts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: Senior Frontend Remote Roles
                criteria:
                  type: object
                  properties:
                    query:
                      type: string
                      example: React
                    location:
                      type: string
                      example: Remote
                    jobType:
                      type: string
                      example: full-time
                    remote:
                      type: boolean
                      example: true
                    salaryMin:
                      type: number
                      example: 120000
                emailAlerts:
                  type: boolean
                  default: true
                frequency:
                  type: string
                  enum: [daily, weekly, instant]
                  default: daily
      responses:
        '201':
          description: Saved search created
  /saved-searches/{id}:
    delete:
      tags:
        - SavedSearches
      summary: Delete a saved search alert
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved search removed
  /analytics/employer/summary:
    get:
      tags:
        - Analytics
      summary: Aggregated employer dashboard KPIs and job conversion rates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: High-level overview metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalJobs:
                        type: integer
                        example: 5
                      activeJobs:
                        type: integer
                        example: 3
                      totalViews:
                        type: integer
                        example: 340
                      totalApplications:
                        type: integer
                        example: 48
                      overallConversionRate:
                        type: number
                        example: 14.12
  /analytics/employer/funnel:
    get:
      tags:
        - Analytics
      summary: 6-stage applicant-to-hire funnel metrics with stage drop-off calculation
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: jobId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pipeline funnel stage counts and drop-off percentages
  /analytics/employer/time-to-hire:
    get:
      tags:
        - Analytics
      summary: Time to hire elapsed days (average, median, min, max)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: jobId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Time-to-hire duration statistics
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

